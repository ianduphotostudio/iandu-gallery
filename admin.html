<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i&u admin</title><link rel="stylesheet" href="style.css"></head><body><main class="admin-main"><section class="admin-card"><img class="logo admin-logo" src="logo.jpeg" onerror="this.style.display='none'"><h1>管理画面</h1><p class="admin-lead">お客様名・撮影内容・Drive・パスワードだけで納品URLを作成できます。</p><label>管理キー<input id="keyInput" type="password" placeholder="管理キー"></label><div class="admin-grid"><label>お客様名<input id="customerInput" placeholder="例：山田様"></label><label>撮影内容<select id="typeInput"><optgroup label="ベビー"><option>ニューボーン</option><option>100日</option><option>お宮参り</option><option>ハーフバースデー</option><option>ころりんフォト</option><option>1000日</option><option>Birthday</option><option>ミルクバス</option><option>BOXフォト</option></optgroup><optgroup label="アニバーサリー"><option>アニバーサリー</option><option>家族写真</option><option>七五三</option><option>マタニティ</option></optgroup><optgroup label="季節・イベント"><option>撮影会</option><option>ひなまつり</option><option>こどもの日</option><option>クリスマス</option></optgroup><optgroup label="その他"><option>その他</option></optgroup></select></label></div><label>Google DriveフォルダURL<input id="folderInput" placeholder="https://drive.google.com/drive/folders/..."></label><label>パスワード<input id="passwordInputAdmin" placeholder="例：1000"></label><button id="saveAlbumBtn" class="button">アルバムを作成</button><p id="adminMessage" class="admin-message"></p><div id="resultBox" class="result-box" style="display:none"><p>お客様に送るURL</p><input id="albumUrlOutput" readonly><img id="qrImage" class="qr-image" style="display:none"><div class="toolbar"><button id="copyUrlBtn" class="button secondary">URLコピー</button><button id="copyTextBtn" class="button secondary">LINE文コピー</button><a id="previewLink" class="button" href="#" target="_blank">アルバム確認</a></div></div><hr><h2>アルバム一覧</h2><input id="searchInput" placeholder="お客様名・撮影内容で検索"><button id="loadListBtn" class="button secondary">一覧を読み込む</button><div id="dashboard" class="dashboard"></div><div id="albumList"></div></section></main><dialog id="editDialog" class="edit-dialog"><form method="dialog"><h2>アルバム編集</h2><input id="editSlug" type="hidden"><label>お客様名<input id="editCustomer"></label><label>撮影内容<input id="editType"></label><label>Google DriveフォルダURL またはID<input id="editFolder"></label><label>パスワード<input id="editPassword"></label><label>ダウンロード期限<input id="editLimit"></label><button id="updateAlbumBtn" class="button" type="button">保存する</button><button class="button secondary" value="cancel">閉じる</button></form></dialog><script>const ALBUM_API_URL="PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";</script><script src="admin.js"></script></body></html>
