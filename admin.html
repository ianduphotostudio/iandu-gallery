<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>i&u album admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="admin-main">
    <section class="download-card admin-card">
      <img class="logo admin-logo" src="logo.jpeg" alt="i&u photo studio">
      <h1>管理画面</h1>
      <p class="admin-lead">お客様名・撮影内容・Drive・パスワードだけでアルバム作成できます。</p>

      <label>管理キー
        <input id="keyInput" type="password" placeholder="管理キー">
      </label>

      <div class="admin-grid">
        <label>お客様名
          <input id="customerInput" type="text" placeholder="例：山田様">
        </label>

        <label>撮影内容
          <select id="typeInput">
            <optgroup label="ベビー">
              <option value="ニューボーン">ニューボーン</option>
              <option value="100日">100日</option>
              <option value="お宮参り">お宮参り</option>
              <option value="ハーフバースデー">ハーフバースデー</option>
              <option value="ころりんフォト">ころりんフォト</option>
              <option value="1000日">1000日</option>
              <option value="Birthday">Birthday</option>
              <option value="ミルクバス">ミルクバス</option>
              <option value="BOXフォト">BOXフォト</option>
            </optgroup>
            <optgroup label="アニバーサリー">
              <option value="アニバーサリー">アニバーサリー</option>
              <option value="家族写真">家族写真</option>
              <option value="七五三">七五三</option>
              <option value="マタニティ">マタニティ</option>
            </optgroup>
            <optgroup label="季節・イベント">
              <option value="撮影会">撮影会</option>
              <option value="ひなまつり">ひなまつり</option>
              <option value="こどもの日">こどもの日</option>
              <option value="クリスマス">クリスマス</option>
            </optgroup>
            <optgroup label="その他">
              <option value="その他">その他</option>
            </optgroup>
          </select>
        </label>
      </div>

      <label>Google DriveフォルダURL
        <input id="folderInput" type="text" placeholder="https://drive.google.com/drive/folders/...">
      </label>

      <label>パスワード（手動）
        <input id="passwordInputAdmin" type="text" placeholder="例：1000">
      </label>

      <button id="saveAlbumBtn" class="button" type="button">アルバムを作成</button>
      <p id="adminMessage" class="admin-message"></p>

      <div id="resultBox" class="result-box" style="display:none;">
        <p>お客様に送るURL</p>
        <input id="albumUrlOutput" type="text" readonly>
        <img id="qrImage" class="qr-image" alt="QRコード" style="display:none;">
        <button id="copyTextBtn" class="button preview-button" type="button">LINE送信用文をコピー</button>
        <a id="previewLink" class="button" href="#" target="_blank">アルバムを確認</a>
      </div>

      <hr class="admin-divider">

      <h2 class="admin-subtitle">アルバム一覧</h2>
      <input id="searchInput" type="text" placeholder="お客様名・撮影内容で検索">
      <button id="loadListBtn" class="button preview-button" type="button">一覧を読み込む</button>
      <div id="dashboard" class="dashboard"></div>
      <div id="albumList" class="album-list"></div>
    </section>
  </main>

  <dialog id="editDialog" class="edit-dialog">
    <form method="dialog">
      <h2>アルバム編集</h2>
      <input id="editSlug" type="hidden">
      <label>お客様名
        <input id="editCustomer" type="text">
      </label>
      <label>撮影内容
        <select id="editType">
            <optgroup label="ベビー">
              <option value="ニューボーン">ニューボーン</option>
              <option value="100日">100日</option>
              <option value="お宮参り">お宮参り</option>
              <option value="ハーフバースデー">ハーフバースデー</option>
              <option value="ころりんフォト">ころりんフォト</option>
              <option value="1000日">1000日</option>
              <option value="Birthday">Birthday</option>
              <option value="ミルクバス">ミルクバス</option>
              <option value="BOXフォト">BOXフォト</option>
            </optgroup>
            <optgroup label="アニバーサリー">
              <option value="アニバーサリー">アニバーサリー</option>
              <option value="家族写真">家族写真</option>
              <option value="七五三">七五三</option>
              <option value="マタニティ">マタニティ</option>
            </optgroup>
            <optgroup label="季節・イベント">
              <option value="撮影会">撮影会</option>
              <option value="ひなまつり">ひなまつり</option>
              <option value="こどもの日">こどもの日</option>
              <option value="クリスマス">クリスマス</option>
            </optgroup>
            <optgroup label="その他">
              <option value="その他">その他</option>
            </optgroup>
          </select>
      </label>
      <label>Google DriveフォルダURL または ID
        <input id="editFolder" type="text">
      </label>
      <label>パスワード
        <input id="editPassword" type="text">
      </label>
      <label>ダウンロード期限
        <input id="editLimit" type="text">
      </label>
      <button id="updateAlbumBtn" class="button" type="button">保存する</button>
      <button class="button preview-button" value="cancel">閉じる</button>
    </form>
  </dialog>

  <script>
    const ALBUM_API_URL = "https://script.google.com/macros/s/AKfycbwbjY4ejFse-sBn8VedqFbaeRR8asowFg7CyW9uuA4ZKErrC4QqlejNxci-BWH6I0za7g/exec";
  </script>
  <script src="admin.js"></script>
</body>
</html>
