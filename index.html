<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>i&u photo studio Online Album</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero">
      <img class="logo" src="logo.jpeg" alt="i&u photo studio">
      <p class="sub">ONLINE ALBUM</p>
      <h1 id="albumTitle">Loading...</h1>
      <p class="lead">いつまでも色褪せない宝物となりますように。</p>
    </section>

    <section id="passwordPanel" class="download-card password-panel" style="display:none;">
      <h2>パスワード入力</h2>
      <p>アルバムを見るには、パスワードを入力してください。</p>
      <input id="passwordInput" type="password" placeholder="パスワード">
      <button id="passwordBtn" class="button" type="button">アルバムを見る</button>
      <p id="passwordError" class="error"></p>
    </section>

    <section id="albumContent" style="display:none;">
      <section class="info-card">
        <div><span>納品日</span><strong id="shootDate"></strong></div>
        <div><span>ダウンロード期限</span><strong id="limitDate"></strong></div>
      </section>

      <section class="download-card">
        <h2>まとめて保存</h2>
        <p>全データを保存したい場合はこちらからGoogle Driveへ進んでください。</p>
        <a id="folderLink" class="button" href="#" target="_blank" rel="noopener">Google Driveを開く</a>
        <a id="downloadAllBtn" class="button sub-button" href="#" target="_blank" rel="noopener">すべてダウンロード</a>
      </section>

      <section>
        <h2 class="gallery-title">Photo Gallery</h2>
        <p id="photoCount" class="gallery-note"></p>
        <button id="favoriteOnlyBtn" class="favorite-filter" type="button">♡ お気に入りだけ表示</button>
        <div id="gallery" class="gallery"><p class="loading">写真を読み込み中です...</p></div>
      </section>
    </section>

    <section class="links">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://lin.ee/TQq1gnG" target="_blank" rel="noopener">LINE予約</a>
      <a href="admin.html">管理画面</a>
    </section>

    <footer><p>Thank you for choosing i&u photo studio.</p></footer>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="closeLightbox" class="close" type="button">×</button>
    <button id="lightboxPrev" class="lightbox-nav lightbox-prev" type="button" aria-label="前の写真">◀</button>
    <img id="lightboxImage" src="" alt="">
    <button id="lightboxNext" class="lightbox-nav lightbox-next" type="button" aria-label="次の写真">▶</button>
    <p id="lightboxCounter" class="lightbox-counter"></p>
    <div class="lightbox-actions">
      <a id="lightboxOriginal" class="original" href="#" target="_blank" rel="noopener">オリジナル保存</a>
      <a id="lightboxMobile" class="mobile" href="#" target="_blank" rel="noopener">スマホ用保存</a>
    </div>
  </div>

  <script>
    const ALBUM_API_URL = "https://script.google.com/macros/s/AKfycbwbjY4ejFse-sBn8VedqFbaeRR8asowFg7CyW9uuA4ZKErrC4QqlejNxci-BWH6I0za7g/exec";
    const DEFAULT_SLUG = "yamada1000";
  </script>
  <script src="script.js"></script>
</body>
</html>
